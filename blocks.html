<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenderfy — Super Admin · Blocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="components.css">
<style>
  /* One filter bar: category tabs (left) + status filter (right) */
  .blk-tabbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;border-bottom:1px solid var(--border);margin-bottom:20px}
  .blk-tabbar .blk-tabs{border-bottom:none;margin-bottom:0;flex:1;min-width:0;scrollbar-width:none;-ms-overflow-style:none}
  .blk-tabbar .blk-tabs::-webkit-scrollbar{width:0;height:0}
  .blk-statusrow{display:flex;gap:6px;margin:0 0 8px;flex-shrink:0;align-self:center}
  .blk-schip{padding:5px 11px}
  .blk-schip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--gray);background:#fff;border:1px solid var(--border);border-radius:100px;padding:6px 13px;cursor:pointer}
  .blk-schip:hover{border-color:var(--teal);color:var(--teal)}
  .blk-schip.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .blk-schip .n{font-size:11px;opacity:.7}
  .blk-schip.on .n{opacity:.85}
  /* Consistent listing cards — fixed preview + clamped description + pinned footer */
  .blk-grid .blk-card{display:flex;flex-direction:column}
  .blk-grid .blk-name{min-width:0}
  .blk-grid .blk-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .blk-grid .blk-name .badge{flex-shrink:0}
  .blk-grid .blk-preview{height:134px;min-height:134px;overflow:hidden}
  .blk-grid .blk-desc{font-size:12px;color:var(--gray);padding-top:11px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:35px;box-sizing:content-box}
  .blk-grid .blk-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--light);padding-top:9px;margin-top:auto;border-top:1px solid var(--border)}
  /* Quick-action kebab on each card */
  .blk-grid .blk-name{gap:6px}
  .blk-kebwrap{position:relative;flex-shrink:0;display:flex}
  .blk-kebab{border:none;background:transparent;color:var(--light);cursor:pointer;padding:2px;border-radius:6px;display:flex;line-height:0}
  .blk-kebab:hover{color:var(--teal);background:var(--teal-tint)}
  .blk-kebab .ms{font-size:19px}
  .blk-kebwrap .kebab-menu{min-width:172px}
</style>
</head>
<body data-page="blocks" data-title="Blocks">
<div id="app-content">
  <div class="pad">
    <div class="pg-head">
      <div>
        <div class="tn-title">Blocks</div>
        <div class="pg-sub">The building blocks behind the Block Builder — one shared set for every client.</div>
      </div>
      <div class="pg-acts" id="pgActs"></div>
    </div>

    <div class="blk-tabbar">
      <div class="blk-tabs" id="tabs"></div>
      <div class="blk-statusrow" id="statusRow"></div>
    </div>
    <div class="blk-grid" id="grid"></div>
    <div id="empty" style="display:none;text-align:center;color:var(--light);padding:50px 0"><span class="ms" style="font-size:40px">search_off</span><p class="mt16">No blocks with this status.</p></div>
  </div>
</div>
<script src="shell.js"></script>
<script src="blocks-data.js"></script>
<script>
function pageInit(){
  const cats=['All Blocks', ...BLOCK_CATS];
  let active='All Blocks', activeStatus='all';

  function renderActs(){
    const acts=document.getElementById('pgActs');
    acts.innerHTML = active==='Headers & Footers'
      ? `<a class="btn btn-outline btn-sm" href="block-edit.html#slot=footer"><span class="ms" style="font-size:17px">flip_to_back</span> New footer</a>
         <a class="btn btn-primary btn-sm" href="block-edit.html#slot=header"><span class="ms" style="font-size:17px">flip_to_front</span> New letterhead</a>`
      : `<a class="btn btn-primary btn-sm" href="block-edit.html"><span class="ms" style="font-size:18px">add</span> Create Custom Block</a>`;
  }
  function renderTabs(){
    document.getElementById('tabs').innerHTML=cats.map(c=>`<span class="blk-tab ${c===active?'on':''}" data-cat="${c}">${c}</span>`).join('');
    document.querySelectorAll('#tabs .blk-tab').forEach(t=>t.addEventListener('click',()=>{active=t.dataset.cat;renderTabs();renderActs();renderStatusRow();renderGrid();}));
  }
  function renderStatusRow(){
    const inCat=b=>active==='All Blocks'||b.cat===active;
    const opts=[['all','All'],['active','Active'],['draft','Draft'],['inactive','Inactive']];
    document.getElementById('statusRow').innerHTML=opts.map(([k,l])=>{
      const n=k==='all'?BLOCKS.filter(inCat).length:BLOCKS.filter(b=>inCat(b)&&blockStatus(b.id)===k).length;
      return `<span class="blk-schip ${k===activeStatus?'on':''}" data-st="${k}">${l} <span class="n">${n}</span></span>`;
    }).join('');
    document.querySelectorAll('#statusRow .blk-schip').forEach(c=>c.addEventListener('click',()=>{activeStatus=c.dataset.st;renderStatusRow();renderGrid();}));
  }
  function renderGrid(){
    const list=BLOCKS.filter(b=>(active==='All Blocks'||b.cat===active)&&(activeStatus==='all'||blockStatus(b.id)===activeStatus));
    document.getElementById('grid').innerHTML=list.map(b=>{
      const active=blockStatus(b.id)!=='inactive';
      return `
      <div class="blk-card" data-id="${b.id}">
        <div class="blk-name"><span class="blk-lbl">${b.label}</span> ${blockStatusBadge(b.id)}
          <span class="blk-kebwrap">
            <button class="blk-kebab" data-kebab aria-label="Actions"><span class="ms">more_vert</span></button>
            <div class="kebab-menu">
              <a data-act="edit"><span class="ms">edit</span> Edit</a>
              <a data-act="dup"><span class="ms">content_copy</span> Duplicate</a>
              <div class="kebab-sep"></div>
              <a class="${active?'danger':''}" data-act="toggle"><span class="ms">${active?'block':'check_circle'}</span> ${active?'Deactivate':'Reactivate'}</a>
            </div>
          </span>
        </div>
        <div class="blk-preview">${blockPreview(b.p)}</div>
        <div class="blk-desc">${b.desc}</div>
        <div class="blk-foot"><span>${b.cat}</span><span><span class="ms" style="font-size:13px;vertical-align:-2px">description</span> ${blockUsage(b.id)}</span></div>
      </div>`;}).join('');
    document.getElementById('empty').style.display=list.length?'none':'block';
  }

  // Quick actions: navigate on card click, kebab opens Edit / Duplicate / Deactivate
  const grid=document.getElementById('grid');
  grid.addEventListener('click', e=>{
    const kebab=e.target.closest('.blk-kebab');
    if(kebab){ e.preventDefault(); e.stopPropagation();
      const menu=kebab.parentElement.querySelector('.kebab-menu'), isOpen=menu.classList.contains('open');
      grid.querySelectorAll('.kebab-menu.open').forEach(m=>m.classList.remove('open'));
      if(!isOpen) menu.classList.add('open');
      return; }
    const item=e.target.closest('.kebab-menu a');
    if(item){ e.preventDefault(); e.stopPropagation();
      const card=item.closest('.blk-card'), id=card.dataset.id, blk=BLOCKS.find(x=>x.id===id);
      item.closest('.kebab-menu').classList.remove('open');
      if(item.dataset.act==='edit'){ location.href='block-edit.html#id='+id; }
      else if(item.dataset.act==='dup'){ duplicateBlock(blk.label); }
      else if(item.dataset.act==='toggle'){
        const nowInactive=blockStatus(id)==='inactive';
        BLOCK_STATUS[id]=nowInactive?'active':'inactive';
        renderStatusRow(); renderGrid();
        showToast((nowInactive?'Reactivated':'Deactivated')+': '+blk.label);
      }
      return; }
    const card=e.target.closest('.blk-card');
    if(card){ location.href='block-view.html#id='+card.dataset.id; }
  });

  renderActs(); renderTabs(); renderStatusRow(); renderGrid();
}
</script>
</body>
</html>
