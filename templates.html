<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenderfy — Super Admin · Tender Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="components.css">
<style>
  .stat-row.stat-compact{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
  .stat-compact .stat-tile{display:flex;align-items:center;gap:13px;padding:13px 16px}
  .stat-compact .st-ic{margin-bottom:0;flex-shrink:0}
  .stat-compact .st-lbl{margin-top:2px}
  /* Filters toggle + reveal row */
  /* Template packs — no preview; show pack facts */
  .tpl-facts{display:flex;flex-wrap:wrap;gap:8px 16px;padding:12px 0 2px}
  .tpl-fact{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);font-weight:500}
  .tpl-fact .ms{font-size:16px;color:var(--teal)}
</style>
</head>
<body data-page="templates" data-title="Tender Templates">
<div id="app-content">
  <div class="pad">
    <div class="pg-head">
      <div>
        <div class="tn-title">Tender Templates</div>
        <div class="pg-sub">Reusable presets clients start from — each takes its branding on assign.</div>
      </div>
      <div class="pg-acts">
        <a class="btn btn-outline btn-sm" href="qa.html"><span class="ms" style="font-size:17px">fact_check</span> Review queue</a>
        <a class="btn btn-primary btn-sm" href="template-edit.html"><span class="ms" style="font-size:18px">add</span> New Tender Template</a>
      </div>
    </div>

    <div class="stat-row stat-compact">
      <div class="stat-tile"><div class="st-ic"><span class="ms">space_dashboard</span></div><div class="st-txt"><div class="st-big" id="s-total">0</div><div class="st-lbl">Tender templates</div></div></div>
      <div class="stat-tile"><div class="st-ic" style="background:var(--st-green-bg);color:var(--st-green-tx)"><span class="ms">rocket_launch</span></div><div class="st-txt"><div class="st-big" id="s-live">0</div><div class="st-lbl">Live</div></div></div>
      <div class="stat-tile"><div class="st-ic" style="background:var(--st-amber-bg);color:var(--st-amber-tx)"><span class="ms">rate_review</span></div><div class="st-txt"><div class="st-big" id="s-review">0</div><div class="st-lbl">In review</div></div></div>
      <div class="stat-tile"><div class="st-ic" style="background:var(--st-grey-bg);color:var(--st-grey-tx)"><span class="ms">edit_note</span></div><div class="st-txt"><div class="st-big" id="s-draft">0</div><div class="st-lbl">Draft</div></div></div>
    </div>

    <div class="lst-bar">
      <div class="lst-tabs" id="tabs"></div>
      <button class="lst-filterbtn" id="filterToggle"><span class="ms">tune</span> Filters <span class="lst-fcount" id="fcount" style="display:none"></span></button>
    </div>
    <div class="lst-filters" id="filterRow" hidden>
      <span class="lst-search"><span class="ms">search</span><input id="q" placeholder="Search templates…"></span>
      <div class="lst-pills" id="statusRow"></div>
    </div>
    <div class="lst-grid" id="grid"></div>
    <div id="empty" style="display:none;text-align:center;color:var(--light);padding:50px 0"><span class="ms" style="font-size:40px">search_off</span><p class="mt16">No templates match.</p></div>
  </div>
</div>
<script src="shell.js"></script>
<script src="blocks-data.js"></script>
<script src="tenant-data.js"></script>
<script src="template-data.js"></script>
<script>
function pageInit(){
  const cats=['All', ...TEMPLATE_CATS];
  let activeCat='All', activeStatus='all', query='', filtersOpen=false;

  function updateFcount(){
    const n=(activeStatus!=='all'?1:0)+(query?1:0);
    const fc=document.getElementById('fcount');
    fc.textContent=n||''; fc.style.display=n?'':'none';
    document.getElementById('filterToggle').classList.toggle('on', filtersOpen||n>0);
  }
  function renderTabs(){
    document.getElementById('tabs').innerHTML=cats.map(c=>`<span class="lst-tab ${c===activeCat?'on':''}" data-cat="${c}">${c}</span>`).join('');
    document.querySelectorAll('#tabs .lst-tab').forEach(t=>t.addEventListener('click',()=>{activeCat=t.dataset.cat;renderTabs();renderStatusRow();renderGrid();}));
  }
  function renderStatusRow(){
    const inCat=t=>activeCat==='All'||t.category===activeCat;
    const opts=[['all','All'],['live','Live'],['approved','Approved'],['inreview','In review'],['draft','Draft']];
    document.getElementById('statusRow').innerHTML=opts.map(([k,l])=>{
      const n=k==='all'?TEMPLATES.filter(inCat).length:TEMPLATES.filter(t=>inCat(t)&&t.status===k).length;
      return `<span class="lst-pill ${k===activeStatus?'on':''}" data-st="${k}">${l} <span class="n">${n}</span></span>`;
    }).join('');
    document.querySelectorAll('#statusRow .lst-pill').forEach(p=>p.addEventListener('click',()=>{activeStatus=p.dataset.st;renderStatusRow();renderGrid();updateFcount();}));
  }
  function renderGrid(){
    const list=TEMPLATES.filter(t=>
      (activeCat==='All'||t.category===activeCat) &&
      (activeStatus==='all'||t.status===activeStatus) &&
      (!query||(t.name+' '+t.category+' '+t.desc).toLowerCase().includes(query)));
    document.getElementById('grid').innerHTML=list.map(t=>`
      <div class="lst-card" data-id="${t.id}">
        <div class="lst-name"><span class="lst-lbl">${t.name}</span><span class="lst-use">v${t.version} · ${t.updated}</span></div>
        <div class="lst-desc">${t.desc}</div>
        <div class="tpl-facts">
          <span class="tpl-fact"><span class="ms">description</span> ${t.comps} documents</span>
          <span class="tpl-fact"><span class="ms">${t.tenants.length?'groups':'group_off'}</span> ${t.tenants.length?t.tenants.length+' client'+(t.tenants.length>1?'s':''):'Unassigned'}</span>
        </div>
        <div class="lst-foot">
          ${templateBadge(t.status)}
          <span class="lst-cat">${t.category}</span>
          <span class="lst-kebwrap">
            <button class="lst-kebab" data-kebab aria-label="Actions"><span class="ms">more_vert</span></button>
            <div class="kebab-menu kebab-up">
              <a data-act="edit"><span class="ms">edit</span> Edit template</a>
              <a data-act="dup"><span class="ms">content_copy</span> Duplicate</a>
              <div class="kebab-sep"></div>
              <a class="danger" data-act="del"><span class="ms">delete</span> Delete</a>
            </div>
          </span>
        </div>
      </div>`).join('');
    document.getElementById('empty').style.display=list.length?'none':'block';
  }

  const grid=document.getElementById('grid');
  grid.addEventListener('click', e=>{
    const kebab=e.target.closest('.lst-kebab');
    if(kebab){ e.preventDefault(); e.stopPropagation();
      const menu=kebab.parentElement.querySelector('.kebab-menu'), isOpen=menu.classList.contains('open');
      grid.querySelectorAll('.kebab-menu.open').forEach(m=>m.classList.remove('open'));
      if(!isOpen) menu.classList.add('open'); return; }
    const item=e.target.closest('.kebab-menu a');
    if(item){ e.preventDefault(); e.stopPropagation();
      const card=item.closest('.lst-card'), t=TEMPLATES.find(x=>x.id===card.dataset.id);
      item.closest('.kebab-menu').classList.remove('open');
      if(item.dataset.act==='edit'){ location.href='template-edit.html#id='+t.id; }
      else if(item.dataset.act==='dup'){ showToast('Duplicated: '+t.name); }
      else if(item.dataset.act==='del'){ showToast('Deleted: '+t.name); }
      return; }
    const card=e.target.closest('.lst-card');
    if(card){ location.href='template-view.html#id='+card.dataset.id; }
  });
  document.getElementById('q').addEventListener('input',e=>{query=e.target.value.toLowerCase().trim();renderGrid();updateFcount();});
  document.getElementById('filterToggle').addEventListener('click',()=>{
    filtersOpen=!filtersOpen;
    document.getElementById('filterRow').hidden=!filtersOpen;
    updateFcount();
  });

  renderTabs(); renderStatusRow(); renderGrid();
  document.getElementById('s-total').textContent=TEMPLATES.length;
  document.getElementById('s-live').textContent=TEMPLATES.filter(t=>t.status==='live').length;
  document.getElementById('s-review').textContent=TEMPLATES.filter(t=>t.status==='inreview').length;
  document.getElementById('s-draft').textContent=TEMPLATES.filter(t=>t.status==='draft').length;
}
</script>
</body>
</html>
