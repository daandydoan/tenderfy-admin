<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenderfy — Super Admin · Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="components.css">
<style>
  .cd-canvas{max-height:calc(100vh - 210px)}
  .hdr-brand{display:inline-flex;align-items:center;gap:6px;color:var(--gray);font-size:12.5px;margin-right:6px}
  .hdr-brand .ms{font-size:17px;color:var(--teal)}
  .hdr-brand .fin-sm{min-width:180px;padding:7px 10px;font-size:12.5px;width:auto}
  .cd-head-l{display:flex;align-items:center;gap:14px}
  .cd-back{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--gray);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;text-decoration:none}
  .cd-back:hover{border-color:var(--teal);color:var(--teal)}
  .cd-back .ms{font-size:20px}
  .btn.btn-icon{padding:0;width:34px;height:34px;justify-content:center}
  .btn.btn-icon .ms{font-size:18px;margin:0}
  .tpl-doc{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--row);font-size:13px;color:var(--ink);text-decoration:none;border-radius:7px}
  .tpl-doc:last-child{border-bottom:none}
  .tpl-doc:hover{background:var(--teal-tint);color:var(--teal)}
  .tpl-doc .n{width:22px;height:22px;border-radius:6px;background:var(--teal-tint);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
  .tpl-dt{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--gray);background:#eef3f1;border-radius:100px;padding:1px 7px}
</style>
</head>
<body data-page="templates" data-title="Tender Templates">
<div id="app-content">
  <div class="pad">
    <div class="pg-head">
      <div class="cd-head-l">
        <a class="cd-back" href="templates.html" title="Back to Templates"><span class="ms">arrow_back</span></a>
        <div>
          <div class="tn-title" id="t-name">—</div>
          <div class="pg-sub" id="t-desc"></div>
        </div>
      </div>
      <div class="pg-acts">
        <a class="btn btn-outline btn-sm btn-icon" id="dupBtn" title="Duplicate"><span class="ms">content_copy</span></a>
        <a class="btn btn-danger btn-sm btn-icon" id="delBtn" title="Delete"><span class="ms">delete</span></a>
        <a class="btn btn-primary btn-sm" id="editBtn"><span class="ms" style="font-size:17px">edit</span> Edit</a>
      </div>
    </div>

    <div class="row">
      <div class="grow">
        <div class="sa-sech"><span>Template preview</span><span style="display:flex;align-items:center;gap:12px"><span class="view-seg" id="viewSeg"><button data-v="a4" class="on"><span class="ms">description</span> A4</button><button data-v="digital"><span class="ms">devices</span> Digital</button></span><span class="hdr-brand"><span class="ms">palette</span> Preview style <select id="brandSel" class="fin fin-sm"></select></span></span></div>
        <div class="tpl-stage cd-canvas"><div id="t-page"></div></div>
      </div>
      <div class="rail cd-side">
        <div class="card">
          <div class="sa-sech" style="justify-content:flex-start;font-size:15px">Details</div>
          <div class="cd-attr"><span class="k">Category</span><span class="v" id="a-cat">—</span></div>
          <div class="cd-attr"><span class="k">Status</span><span class="v" id="a-status">—</span></div>
          <div class="cd-attr"><span class="k">Documents</span><span class="v" id="a-docs">—</span></div>
          <div class="cd-attr"><span class="k">Assigned clients</span><span class="v" id="a-clients">—</span></div>
          <div class="cd-attr"><span class="k">Current version</span><span class="v" id="a-ver">—</span></div>
          <div class="cd-attr"><span class="k">Last updated</span><span class="v" id="a-upd">—</span></div>
        </div>
        <div class="card">
          <div class="sa-sech" style="justify-content:flex-start;font-size:15px">Documents included</div>
          <div id="a-doclist"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="shell.js"></script>
<script src="tenant-data.js"></script>
<script src="blocks-data.js"></script>
<script src="library-data.js"></script>
<script src="primitives.js"></script>
<script src="block-layouts.js"></script>
<script src="document-render.js"></script>
<script src="resume-render.js"></script>
<script src="document-content.js"></script>
<script src="template-data.js"></script>
<script src="template-preview.js"></script>
<script>
function pageInit(){
  const byId = Object.fromEntries(TENANTS.map(t=>[t.id,t]));
  const id = new URLSearchParams(location.search || location.hash.slice(1)).get('id') || TEMPLATES[0].id;
  const t = TEMPLATES.find(x=>x.id===id) || TEMPLATES[0];
  let brand = null;

  document.title = 'Tenderfy — Super Admin · '+t.name;
  document.getElementById('t-name').textContent = t.name;
  document.getElementById('t-desc').textContent = t.desc;
  document.getElementById('a-cat').textContent = t.category;
  (function(){
    const opts=[['live','Live'],['approved','Approved'],['inreview','In review'],['draft','Draft']];
    document.getElementById('a-status').innerHTML=`<select class="status-sel" id="statusSel">${opts.map(([v,l])=>`<option value="${v}"${v===t.status?' selected':''}>${l}</option>`).join('')}</select>`;
    document.getElementById('statusSel').addEventListener('change',e=>{ t.status=e.target.value; showToast('Status set to '+e.target.options[e.target.selectedIndex].text); });
  })();
  document.getElementById('a-docs').textContent = t.comps + ' documents';
  document.getElementById('a-clients').textContent = t.tenants.length ? t.tenants.map(id=>byId[id]?byId[id].name:id).join(', ') : 'Unassigned';
  document.getElementById('a-ver').textContent = 'v'+t.version;
  document.getElementById('a-upd').textContent = t.updated;
  document.getElementById('editBtn').setAttribute('href','template-edit.html#id='+t.id);
  document.getElementById('dupBtn').addEventListener('click',()=>showToast('Duplicated: '+t.name));
  document.getElementById('delBtn').addEventListener('click',()=>showToast('Deleted: '+t.name));

  const byComp = Object.fromEntries(COMPONENTS.map(c=>[c.id,c]));
  const docs = templateDocs(t);
  document.getElementById('a-doclist').innerHTML = docs.map((id,i)=>{ const c=byComp[id]; const tm=(typeof DOC_TYPE_META!=='undefined'&&c&&DOC_TYPE_META[c.type])||null; return `<a class="tpl-doc" href="document-view.html#id=${id}" title="Open document"><span class="n">${i+1}</span><span style="flex:1">${c?c.name:id}</span>${tm?`<span class="tpl-dt">${tm.label}</span>`:''}<span class="ms" style="font-size:15px;color:var(--light)">north_east</span></a>`; }).join('');

  // Brand-aware A4 preview — cover page + every document rendered in the pack
  const BRANDS = [{name:'Default (brand-neutral)', brand:null}, ...TENANTS.map(x=>({name:x.name, brand:x.brand}))];
  const sel = document.getElementById('brandSel');
  sel.innerHTML = BRANDS.map((x,i)=>`<option value="${i}">${x.name}</option>`).join('');
  let viewMode='a4';
  function renderTemplate(){
    const el=document.getElementById('t-page');
    renderTemplatePreview(el, {name:t.name, docs, brand, version:t.version, category:t.category});
    el.classList.toggle('digital', viewMode==='digital');
  }
  sel.addEventListener('change', e=>{ brand = BRANDS[+e.target.value].brand; renderTemplate(); });
  document.querySelectorAll('#viewSeg button').forEach(b=>b.addEventListener('click',()=>{
    viewMode=b.dataset.v; document.querySelectorAll('#viewSeg button').forEach(x=>x.classList.toggle('on',x===b)); renderTemplate();
  }));
  renderTemplate();
}
</script>
</body>
</html>
